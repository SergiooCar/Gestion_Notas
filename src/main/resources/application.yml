spring:
  application:
    name: Gestion_Notas

  datasource:
    url: jdbc:postgresql://localhost:5432/gestion_notas_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
